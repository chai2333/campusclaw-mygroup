<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CampusClaw{% endblock %}</title>
    <style>
      body { font-family: sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
      nav { display: flex; justify-content: space-between; align-items: center; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border-bottom: 1px solid #ddd; padding: .6rem; text-align: left; }
      .error { color: #a00; }
      form { margin: 1rem 0; }
    </style>
  </head>
  <body>
    <nav>
      <strong>CampusClaw</strong>
      {% if g.user %}
        <form id="logout-form"><button type="submit">退出</button></form>
      {% endif %}
    </nav>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <p class="{{ category }}">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
    <p id="auth-error" class="error" role="alert"></p>
    <script src="{{ url_for('static', filename='auth.js') }}" defer></script>
  </body>
</html>
