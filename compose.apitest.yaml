# Separate project, network and disposable volumes; never overlays compose.yaml.
services:
  mcp-demo:
    build: ./mcp-server
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?required}
      MCP_TEST_MODE: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: campusclaw_apitest
      MYSQL_USER: campusclaw
      MYSQL_PASSWORD: ${DB_PASSWORD:?required}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 2s
      timeout: 3s
      retries: 60
    volumes:
      - apitest_mysql:/var/lib/mysql
      - ./apitest/mysql-init:/docker-entrypoint-initdb.d:ro
  model:
    image: python:3.12-slim
    command: ["python", "/mock_model.py"]
    volumes:
      - ./apitest/mock_model.py:/mock_model.py:ro
  qdrant:
    image: qdrant/qdrant:v1.14.1
  api:
    build: ./backend
    environment:
      APP_ENV: development
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?required}
      MCP_DEFAULT_BASE_URL: ${MCP_DEFAULT_BASE_URL:-http://mcp-demo:8090}
      MCP_ALLOWED_BASE_URLS: ${MCP_ALLOWED_BASE_URLS:-http://mcp-demo:8090}
      MCP_MAX_ROUNDS: ${MCP_MAX_ROUNDS:-3}
      MCP_MAX_TURN_CALLS: ${MCP_MAX_TURN_CALLS:-6}
      MCP_MAX_CONVERSATION_CALLS: ${MCP_MAX_CONVERSATION_CALLS:-12}
      SESSION_SECRET: ${SESSION_SECRET:?required}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: campusclaw_apitest
      DB_USER: campusclaw
      DB_PASSWORD: ${DB_PASSWORD:?required}
      SEED_TEACHER_PASSWORD: ${SEED_TEACHER_PASSWORD:?required}
      SEED_STUDENT_PASSWORD: ${SEED_STUDENT_PASSWORD:?required}
      UPLOAD_DIR: /data/uploads
      DIALOGUE_BASE_URL: http://model:8090/v1
      DIALOGUE_MODEL: apitest-model
      DIALOGUE_API_KEY: ${DIALOGUE_API_KEY:?required}
      DIALOGUE_TIMEOUT_SECONDS: 10
      EMBEDDING_BASE_URL: http://model:8090/v1
      EMBEDDING_MODEL: apitest-embedding
      EMBEDDING_API_KEY: ${DIALOGUE_API_KEY:?required}
      EMBEDDING_DIMENSION: 16
      QDRANT_BASE_URL: http://qdrant:6333
      QDRANT_COLLECTION: apitest_chunks
    depends_on:
      db:
        condition: service_healthy
      model:
        condition: service_started
      qdrant:
        condition: service_started
    volumes:
      - apitest_uploads:/data/uploads
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${APITEST_WEB_PORT:-18080}:8080"
    depends_on:
      - api
  runner:
    build:
      context: .
      dockerfile: apitest/Dockerfile
    profiles: ["test"]
    environment:
      APITEST_BASE_URL: http://web:8080
      APITEST_DB_HOST: db
      APITEST_DB_NAME: campusclaw_apitest
      APITEST_DB_USER: campusclaw
      APITEST_DB_PASSWORD: ${DB_PASSWORD:?required}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?required}
      MCP_DEFAULT_BASE_URL: ${MCP_DEFAULT_BASE_URL:-http://mcp-demo:8090}
      MCP_ALLOWED_BASE_URLS: ${MCP_ALLOWED_BASE_URLS:-http://mcp-demo:8090}
      MCP_MAX_ROUNDS: ${MCP_MAX_ROUNDS:-3}
      MCP_MAX_TURN_CALLS: ${MCP_MAX_TURN_CALLS:-6}
      MCP_MAX_CONVERSATION_CALLS: ${MCP_MAX_CONVERSATION_CALLS:-12}
      SESSION_SECRET: ${SESSION_SECRET:?required}
      SEED_TEACHER_PASSWORD: ${SEED_TEACHER_PASSWORD:?required}
      SEED_STUDENT_PASSWORD: ${SEED_STUDENT_PASSWORD:?required}
      APITEST_MCP_BASE_URL: http://mcp-demo:8090
      APITEST_PROVIDER: mock
    volumes:
      - ./apitest/reports:/work/apitest/reports
  backend-tests:
    image: golang:1.26.1-alpine
    profiles: ["test"]
    working_dir: /src
    volumes:
      - ./backend:/src
      - apitest_go_modules:/go/pkg/mod
      - apitest_go_build:/root/.cache/go-build
    environment:
      TEST_MYSQL_DSN: campusclaw:${DB_PASSWORD}@tcp(db:3306)/campusclaw_unit_apitest?parseTime=true&multiStatements=true&charset=utf8mb4
    command: ["go", "test", "-count=1", "-p", "1", "./..."]
volumes:
  apitest_mysql:
  apitest_uploads:
  apitest_go_modules:
  apitest_go_build:
