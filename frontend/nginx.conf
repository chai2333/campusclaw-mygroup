worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Let the API own its error responses; nginx must not rewrite them to HTML.
    proxy_intercept_errors off;

    upstream api_backend {
        server api:8080;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # /uploads must never be served statically or fall through to SPA.
        location /uploads/ {
            return 404;
        }

        # API, health, ready — same-origin proxy to Go backend.
        # Errors stay JSON because proxy_intercept_errors is off.
        location /api/ {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
        }

        location = /ready {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
        }

        # Internal auth subrequest — checks /api/me for protected pages.
        location = /_auth_check {
            internal;
            proxy_pass http://api_backend/api/me;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Original-URI $request_uri;
        }

        # Protected pages — require an authenticated session.
        # 401 → redirect to /login; 503 → service unavailable (no auth clearing).
        location /materials {
            auth_request /_auth_check;
            error_page 401 = @redirect_login;
            error_page 503 = @service_unavailable;
            try_files $uri $uri/ /index.html;
        }

        location @redirect_login {
            return 302 /login;
        }

        location @service_unavailable {
            default_type application/json;
            return 503 '{"error":"service_unavailable"}';
        }

        # Public routes — SPA fallback.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
