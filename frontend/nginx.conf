worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Let the API own its error responses; nginx must not rewrite them to HTML.
    proxy_intercept_errors off;

    upstream api_backend {
        server api:8080;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # /uploads must never be served statically or fall through to SPA.
        location /uploads/ {
            return 404;
        }

        location = /openapi.json {
            proxy_pass http://api_backend;
        }

        location /swagger/ {
            proxy_pass http://api_backend;
        }

        location = /swagger {
            return 308 /swagger/;
        }

        # API, health, ready — same-origin proxy to Go backend.
        # Errors stay JSON because proxy_intercept_errors is off.
        location /api/ {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Conversation message stream (POST SSE). Buffering must stay off so
        # delta frames reach the browser as they are flushed; the long read
        # timeout covers bounded generation. Authorization is preserved.
        location ~ ^/api/conversations/[^/]+/messages$ {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
        }

        location = /health {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
        }

        location = /ready {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
        }

        # The SPA shell contains no protected data. React checks /api/me with
        # its Bearer token before rendering the materials route; every business
        # API independently enforces authentication and class authorization.
        location /materials {
            try_files $uri $uri/ /index.html;
        }

        # Public routes — SPA fallback.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
